server:
  # Puerto local del agente. Distinto del 8081 (datos) para poder correr ambos.
  port: 8181
  # A10: SOLO la propia máquina. Sin esto Spring escucha en todas las interfaces y otro equipo de la red del
  # local podía imprimir o abrir el cajón con un curl a <IP>:8181. El POS llama a http://localhost:8181.
  address: 127.0.0.1

spring:
  application:
    name: ms-print-agent

# Nombre (o fragmento) de la impresora en el SO. Default para la clase SAT Q22.
printer:
  name: SAT

agente:
  # A10: los orígenes (el POS) que pueden llamar al agente desde el navegador, separados por coma. Cualquier
  # otra web abierta en el equipo recibe 403 y ninguna cabecera CORS. Por defecto, SOLO el POS de producción:
  # en un equipo de comercio, localhost:4200 sería cualquier programa local. Staging y desarrollo entran solo
  # en sus máquinas, con AGENTE_ORIGENES.
  origenes: ${AGENTE_ORIGENES:https://pos-caja.suresell.com.co}
